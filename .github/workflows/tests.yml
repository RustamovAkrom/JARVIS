name: Tests

on:
  workflow_call:
  push:
    branches: [main, v2, integration/mark-lix-features, glm-ui-ux-modernization]
  pull_request:
    branches: [main, v2, integration/mark-lix-features]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: ${{ matrix.os }} / Python 3.14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libpulse0 libva-drm2

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

  pyside6-compat:
    name: PySide6 compatibility / Ubuntu / Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libpulse0 libva-drm2

      - name: Install application and optional PySide6 binding
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "PySide6>=6.6,<7"

      - name: Verify PySide6 binding and PyQt6 plugin aliases
        env:
          QT_API: pyside6
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_qt_pyside6_subprocess.py tests/test_qt_widgets_compat.py tests/test_qt_multimedia_import.py
