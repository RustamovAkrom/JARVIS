name: Windows Release

on:
  push:
    branches: [main]
    paths: ["pyproject.toml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  package:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Validate release version and choose tag
        id: release
        shell: pwsh
        run: |
          $version = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          $tag = "v$version"
          if ($env:GITHUB_REF -ne "refs/heads/main") { throw "Automatic releases are allowed only from main." }
          $existingTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Could not check whether release tag $tag already exists." }
          if ($existingTag) { throw "Release tag $tag already exists. Bump the project version before merging another release to main." }
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Install application and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'pyinstaller>=6.22.3,<7' 'pyinstaller-hooks-contrib>=2026.8'
      - name: Install Velopack CLI
        run: dotnet tool install --global vpk --version 1.2.161
      - name: Build and smoke test package
        run: python tools/build_release.py --output release
      - name: Add SHA-256 manifest
        shell: pwsh
        run: Get-ChildItem release -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $((Split-Path $_.Path -Leaf))" } | Set-Content release/SHA256SUMS.txt
      - name: Publish GitHub release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.release.outputs.tag }}" release/* --title "JARVIS ${{ steps.release.outputs.tag }}" --generate-notes --target "$env:GITHUB_SHA"
