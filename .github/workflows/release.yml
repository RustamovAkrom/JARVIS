name: Windows Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/tests.yml

  package:
    name: Build and validate Windows distribution
    needs: test
    if: >-
      always() &&
      (github.event_name == 'pull_request' || needs.test.result == 'success')
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate project version and determine release eligibility
        id: release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          if ($LASTEXITCODE -ne 0) { throw "Could not read project version from pyproject.toml." }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Expected a stable MAJOR.MINOR.PATCH version, got '$version'."
          }

          $tag = "v$version"
          $shouldPublish = "false"
          if ($env:GITHUB_EVENT_NAME -ne "pull_request" -and $env:GITHUB_REF -eq "refs/heads/main") {
            $existingTag = git ls-remote --exit-code --tags origin "refs/tags/$tag"
            $gitExit = $LASTEXITCODE
            if ($gitExit -eq 0 -and $existingTag) {
              Write-Host "Version $version is already released as $tag. Build artifacts will be retained; duplicate publication is skipped."
            } elseif ($gitExit -eq 2) {
              $shouldPublish = "true"
              Write-Host "Version $version has not been released. This successful main build is eligible to publish $tag."
            } else {
              throw "Unable to query remote tag $tag (git exit code $gitExit). Refusing to guess release state."
            }
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "should_publish=$shouldPublish" >> $env:GITHUB_OUTPUT

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install build dependencies
        run: |
          python -m pip install "pyinstaller>=6.22.3,<7" "pyinstaller-hooks-contrib>=2026.8"

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk --version 1.2.161

      - name: Build application and companion launcher
        run: python tools/build_release.py --output release

      - name: Verify release package contents
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = "release/JARVISClapLauncher.exe"
          if (-not (Test-Path $launcher -PathType Leaf)) {
            throw "Clap launcher executable is missing: $launcher"
          }
          if ((Get-Item $launcher).Length -lt 1000000) {
            throw "Clap launcher executable is unexpectedly small."
          }

          $packages = @(Get-ChildItem release -File -Filter "*.nupkg")
          if ($packages.Count -eq 0) {
            throw "Velopack did not produce a .nupkg package."
          }
          if (-not (Test-Path "release/RELEASES" -PathType Leaf)) {
            throw "Velopack RELEASES manifest is missing."
          }
          if (-not (Get-ChildItem release -File -Filter "*Setup.exe")) {
            throw "Velopack setup executable is missing."
          }

          Get-ChildItem release -File | Select-Object Name, Length

      - name: Generate SHA-256 manifest
        shell: pwsh
        run: |
          $files = Get-ChildItem release -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Path release/SHA256SUMS.txt -Encoding ascii

      - name: Upload validated build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-${{ steps.release.outputs.version }}-${{ github.run_number }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.release.outputs.should_publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.release.outputs.tag }}" release/* --title "JARVIS ${{ steps.release.outputs.tag }}" --generate-notes --verify-tag --target "$env:GITHUB_SHA"

      - name: Report existing version
        if: steps.release.outputs.should_publish == 'false' && github.event_name != 'pull_request'
        run: echo "Build validated and uploaded. No duplicate GitHub Release was created for version ${{ steps.release.outputs.version }}."
