name: Release
run-name: Release / ${{ github.ref_name }} / ${{ github.event_name }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Do not cancel a running release build. Each successful main push should
# retain its own artifact; duplicate version publication is handled below.
permissions:
  contents: read

jobs:
  tests:
    name: Cross-platform test suite
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/tests.yml

  package:
    name: Build and validate Windows distribution
    needs: tests
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      should_publish: ${{ steps.release.outputs.should_publish }}
    if: >-
      always() &&
      (github.event_name == 'pull_request' || needs.tests.result == 'success')
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate version and determine release eligibility
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $version = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read the project version from pyproject.toml."
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Expected a stable MAJOR.MINOR.PATCH version, got '$version'."
          }

          $tag = "v$version"
          $shouldPublish = "false"
          $isMainRef = $env:GITHUB_REF -eq "refs/heads/main"
          $isReleaseEvent = $env:GITHUB_EVENT_NAME -in @("push", "workflow_dispatch")

          if ($isMainRef -and $isReleaseEvent) {
            $tagUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag"
            $headers = @{
              Accept = "application/vnd.github+json"
              Authorization = "Bearer $env:GH_TOKEN"
              "X-GitHub-Api-Version" = "2022-11-28"
            }

            try {
              $null = Invoke-RestMethod -Method Get -Uri $tagUri -Headers $headers
              Write-Host "Version $version is already released as $tag. The build artifact will still be uploaded; duplicate publication is skipped."
            }
            catch {
              $statusCode = 0
              if ($_.Exception.Response -and $_.Exception.Response.StatusCode) {
                $statusCode = [int]$_.Exception.Response.StatusCode
              }

              if ($statusCode -eq 404) {
                $shouldPublish = "true"
                Write-Host "Version $version has not been released. This main-branch build is eligible to publish $tag."
              }
              else {
                throw "Could not verify release tag '$tag' (HTTP status $statusCode). Refusing to publish without a reliable tag check. $($_.Exception.Message)"
              }
            }
          }
          else {
            Write-Host "This is a validation build. GitHub Releases are published only from main."
          }

          $outputs = @(
            "version=$version"
            "tag=$tag"
            "should_publish=$shouldPublish"
          ) -join "`n"
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "$outputs`n")

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install build dependencies
        run: |
          python -m pip install "pyinstaller>=6.22.3,<7" "pyinstaller-hooks-contrib>=2026.8"

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk --version 1.2.161

      - name: Build application and companion launcher
        run: python tools/build_release.py --output release

      - name: Verify Windows release package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $requiredFiles = @(
            "release/JARVISClapLauncher.exe",
            "release/releases.stable.json"
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file -PathType Leaf)) {
              throw "Required release output is missing: $file"
            }
          }

          if ((Get-Item "release/JARVISClapLauncher.exe").Length -lt 1000000) {
            throw "Clap launcher executable is unexpectedly small."
          }

          if (@(Get-ChildItem release -File -Filter "*-full.nupkg").Count -eq 0) {
            throw "Velopack did not produce the required full update package (*-full.nupkg)."
          }
          if (@(Get-ChildItem release -File -Filter "*Setup.exe").Count -eq 0) {
            throw "Velopack did not produce a Setup executable."
          }

          Get-ChildItem release -File | Select-Object Name, Length

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem release -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Path release/SHA256SUMS.txt -Encoding ascii

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-${{ steps.release.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: package
    if: >-
      needs.package.result == 'success' &&
      needs.package.outputs.should_publish == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@v4
        with:
          name: JARVIS-Windows-${{ needs.package.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release

      - name: Publish versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.package.outputs.tag }}" release/* \
            --title "JARVIS ${{ needs.package.outputs.tag }}" \
            --generate-notes \
            --target "${{ github.sha }}"
