name: Windows Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  package:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Validate release tag
        shell: pwsh
        run: |
          $version = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag and pyproject version differ: v$version vs ${{ github.ref_name }}" }
      - name: Install application and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt '.[build]'
      - name: Install Velopack CLI
        run: dotnet tool install --global vpk --version 1.2.161
      - name: Build and smoke test package
        run: python tools/build_release.py --output release
      - name: Add SHA-256 manifest
        shell: pwsh
        run: Get-ChildItem release -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $((Split-Path $_.Path -Leaf))" } | Set-Content release/SHA256SUMS.txt
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/* --title "JARVIS ${{ github.ref_name }}" --generate-notes
